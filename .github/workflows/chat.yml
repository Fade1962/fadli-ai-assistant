name: NARA Realtime Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: nara-realtime-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore NARA memory
        uses: actions/cache/restore@v4
        with:
          path: data
          key: nara-data-${{ github.run_id }}
          restore-keys: |
            nara-data-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run NARA realtime Telegram bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PERSONAL_PROFILE_JSON: ${{ secrets.PERSONAL_PROFILE_JSON }}

          ASSISTANT_NAME: NARA
          AI_PROVIDER_ORDER: gemini,groq,openrouter
          GROQ_MODEL: qwen/qwen3.6-27b
          GROQ_VISION_MODEL: qwen/qwen3.6-27b
          GROQ_WEB_MODEL: groq/compound
          GEMINI_MODEL: gemini-2.5-flash
          OPENROUTER_MODEL: openrouter/free
          TIMEZONE: Asia/Makassar
          ALLOW_SENSITIVE_FALLBACK: "false"

          # Daily Radar dibuat oleh bot yang sama agar rating dan memory tersambung.
          DIGEST_TIME: "06:00"

          # Berhenti normal sebelum batas GitHub agar database sempat disimpan ke cache.
          RUN_DURATION_MINUTES: "350"

        run: python -u app.py

      - name: Save NARA memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: nara-data-${{ github.run_id }}
